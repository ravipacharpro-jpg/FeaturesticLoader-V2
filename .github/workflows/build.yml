name: Build Featurestic Loader APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate App Icons from Logo
        run: |
          python3 -m pip install pillow --break-system-packages || python3 -m pip install pillow || true
          python3 -c "
          import os
          try:
              from PIL import Image
              src = 'app/src/main/res/drawable/app_logo.jpg'
              if os.path.exists(src):
                  im = Image.open(src)
                  im.save('app/src/main/res/drawable/app_logo.png')
                  densities = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
                  for folder, sz in densities.items():
                      d = os.path.join('app/src/main/res', folder)
                      os.makedirs(d, exist_ok=True)
                      im.resize((sz, sz), Image.Resampling.LANCZOS).save(os.path.join(d, 'ic_launcher.png'))
                      im.resize((sz, sz), Image.Resampling.LANCZOS).save(os.path.join(d, 'ic_launcher_round.png'))
                  print('App launcher & round icons generated successfully!')
          except Exception as e:
              print('Icon generation warning:', e)
          "

      - name: Build Debug & Signed Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Built APKs
        uses: actions/upload-artifact@v4
        with:
          name: FeaturesticLoader-V2-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/release/*.apk
